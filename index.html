<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Digital Signage</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff}
#app{width:100%;height:100%;position:relative;display:flex}
#player-wrap{flex:1;position:relative;overflow:hidden;background:#000}
#player{width:100%;height:100%;pointer-events:none}
#player iframe{width:100%;height:100%}
#player .ytp-ad-module,#player .ytp-ad-player-overlay,#player .ytp-ad-overlay-container,#player .ytp-ad-image-overlay,#player .video-ads,#player .ytp-ad-text-overlay{display:none!important}
#sidebar{width:260px;flex-shrink:0;background:rgba(0,0,0,.7);backdrop-filter:blur(16px);border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;transition:transform .3s,margin .3s;z-index:25;overflow:hidden}
#sidebar .header{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;color:rgba(255,255,255,.4);display:flex;justify-content:space-between;align-items:center}
#sidebar .header span{font-weight:600;color:rgba(255,255,255,.6)}
#sidebar .header .sbtn{background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.6);padding:3px 10px;border-radius:6px;cursor:pointer;font-size:10px;transition:.2s}
#sidebar .header .sbtn:hover{background:rgba(255,255,255,.15);color:#fff}
#sidebar .list{flex:1;overflow-y:auto;padding:6px}
.side-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.45);transition:.15s;margin-bottom:2px}
.side-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.7)}
.side-item.active{background:rgba(255,255,255,.1);color:#fff}
.side-item .idx{font-size:10px;color:rgba(255,255,255,.25);width:18px;text-align:right;flex-shrink:0}
.side-item .del{margin-left:auto;background:none;border:none;color:#f44;cursor:pointer;font-size:12px;padding:2px 5px;border-radius:4px;opacity:0;transition:.15s}
.side-item:hover .del{opacity:.6}
.side-item .del:hover{opacity:1;background:rgba(255,50,50,.2)}
#controls{position:fixed;right:0;top:0;height:100%;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s;padding:12px 8px}
#controls.hidden{opacity:0;pointer-events:none}
#panel{background:rgba(0,0,0,.55);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.06);border-radius:16px 0 0 16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
#panel button{background:none;border:none;color:rgba(255,255,255,.7);padding:8px;border-radius:8px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;font-size:16px}
#panel button:hover{background:rgba(255,255,255,.1);color:#fff}
.info{text-align:center;font-size:10px;color:rgba(255,255,255,.5);margin-bottom:4px}
.info .num{font-size:12px;color:#fff;font-weight:600}
.bar{width:48px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin:4px 0}
.bar-fill{height:100%;background:rgba(255,255,255,.6);border-radius:2px;transition:width .3s}
.sep{width:24px;height:1px;background:rgba(255,255,255,.08);margin:6px 0}
#settings-btn,#remote-btn{position:fixed;top:16px;z-index:30;background:rgba(0,0,0,.55);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.06);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);cursor:pointer;transition:.2s;font-size:16px;border:none}
#settings-btn:hover,#remote-btn:hover{color:#fff;transform:scale(1.1)}
#settings-btn{left:274px}
#remote-btn{right:16px}
#exit-fs{position:fixed;top:16px;right:16px;z-index:45;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:8px 14px;color:rgba(255,255,255,.7);font-size:13px;cursor:pointer;transition:.3s;border:none;align-items:center;gap:6px;display:none}
#exit-fs:hover{background:rgba(255,255,255,.12);color:#fff}
.fullscreen #exit-fs{display:flex}
.fullscreen #exit-fs.hidden{display:none}
.fullscreen #sidebar{transform:translateX(-100%);margin-left:-260px}
.fullscreen #settings-btn{display:none}
.fullscreen #remote-btn{display:none}
.fullscreen #status{display:none}
#status{position:fixed;bottom:16px;left:274px;z-index:30;background:rgba(0,0,0,.55);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:4px 10px;font-size:10px;color:rgba(255,255,255,.5);font-family:monospace;display:flex;align-items:center;gap:6px}
#status .dot{width:5px;height:5px;border-radius:50%;background:#4ade80;transition:.3s}
#status .dot.off{background:#666}
.modal-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.modal{background:rgba(0,0,0,.75);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:16px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px}
.modal h2{font-size:18px;font-weight:600;margin-bottom:16px}
.modal label{display:block;font-size:11px;color:rgba(255,255,255,.5);margin-bottom:4px;margin-top:12px}
.modal input,.modal textarea,.modal select{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 10px;color:#fff;font-size:13px;outline:none;transition:.2s}
.modal textarea{resize:vertical;min-height:80px;font-family:monospace;font-size:12px}
.modal .btn{background:rgba(255,255,255,.1);border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
.modal .btn-primary{background:rgba(255,255,255,.15)}
.modal .btn-danger{background:rgba(255,50,50,.15);color:#f66}
.modal .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal .between{display:flex;justify-content:space-between;align-items:center}
.modal .mt{margin-top:12px}
.modal input[type=range]{width:100%;height:4px;background:rgba(255,255,255,.2);border-radius:2px;outline:none;-webkit-appearance:none}
.modal input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer}
#logo-overlay{position:absolute;z-index:20;pointer-events:none;object-fit:contain}
#overlay-text{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;color:#fff;font-size:18px;font-weight:600;text-align:center;padding:12px 24px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border-radius:12px;max-width:90%}
.remote-page{min-height:100vh;background:linear-gradient(135deg,#111,#000);display:flex;flex-direction:column;align-items:center;padding:24px;gap:12px}
.remote-page .rbtn{background:rgba(255,255,255,.08);border:none;color:#fff;width:60px;height:60px;border-radius:16px;font-size:24px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.remote-page .rbtn:hover{background:rgba(255,255,255,.15);transform:scale(1.05)}
.remote-page .rbtn-big{width:76px;height:76px;font-size:30px;background:rgba(255,255,255,.12)}
.remote-page .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.remote-page .rinput{width:100%;max-width:320px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:9px 12px;color:#fff;font-size:13px;outline:none}
.remote-page .rinput:focus{border-color:rgba(255,255,255,.3)}
.remote-page .rlist{width:100%;max-width:320px;margin-top:4px}
.remote-page .ritem{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.5);transition:.1s}
.remote-page .ritem:hover{background:rgba(255,255,255,.05)}
.remote-page .ritem.active{background:rgba(255,255,255,.1);color:#fff}
.remote-page .ritem .idx{font-size:9px;color:rgba(255,255,255,.3);width:16px;text-align:right;flex-shrink:0}
.remote-page .ritem .rdel{margin-left:auto;background:none;border:none;color:#f44;cursor:pointer;font-size:11px;padding:2px 6px;border-radius:4px;opacity:.4}
.remote-page .ritem .rdel:hover{opacity:1;background:rgba(255,50,50,.2)}
.remote-page .rstatus{font-size:10px;color:rgba(255,255,255,.3)}
.remote-page .rstatus .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#666;transition:.3s;margin-right:4px}
.remote-page .rstatus .dot.on{background:#4ade80}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="header"><span>Playlist</span><button class="sbtn" id="savePlaylistBtn">💾 Guardar</button></div>
    <div class="list" id="sideList"><div style="text-align:center;padding:30px 10px;color:rgba(255,255,255,.2);font-size:12px">Agrega videos desde el input de abajo</div></div>
    <div class="header" style="border-top:1px solid rgba(255,255,255,.06);border-bottom:none;padding:10px 16px">
      <input id="sideInput" placeholder="Pega un enlace y presiona Enter" style="background:rgba(255,255,255,.06);border:none;border-radius:6px;padding:6px 10px;color:#fff;font-size:11px;width:100%;outline:none">
    </div>
  </div>
  <div id="player-wrap">
    <div id="player"></div>
    <img id="logo-overlay" style="display:none">
    <div id="overlay-text" style="display:none"></div>
  </div>
  <div id="controls">
    <div id="panel">
      <div class="info"><div class="num" id="videoNum">0/0</div></div>
      <div class="bar"><div class="bar-fill" id="progressBar"></div></div>
      <div class="info" id="timeDisplay">0:00/0:00</div>
      <div class="sep"></div>
      <button id="btnPlay">▶</button>
      <button id="btnPrev">⏮</button>
      <button id="btnNext">⏭</button>
      <button id="btnRestart">↺</button>
      <button id="btnMute">🔊</button>
      <div class="sep"></div>
      <button id="btnFullscreen">⛶</button>
      <div class="sep"></div>
      <button id="btnMinimize" style="font-size:12px;color:rgba(255,255,255,.3)">◀</button>
    </div>
  </div>
  <button id="settings-btn">⚙</button>
  <button id="remote-btn">📱</button>
  <button id="exit-fs">✕ Salir pantalla completa</button>
  <div id="status"><span class="dot" id="fbDot"></span><span id="statusText">Sin videos</span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBfRxs7Jygy86b4yFEr5WKl6guyzcThyzs",
  authDomain: "vainapabuena.firebaseapp.com",
  databaseURL: "https://vainapabuena-default-rtdb.firebaseio.com",
  projectId: "vainapabuena",
  storageBucket: "vainapabuena.firebasestorage.app",
  messagingSenderId: "232157375786",
  appId: "1:232157375786:web:69ffc3dc4f00f022354253"
};

firebase.initializeApp(firebaseConfig);
const fbDB = firebase.database();

const STORAGE_KEY='vp2-config';
const DEFAULTS={videoUrls:[],logo:null,logoSize:120,logoPosition:'bottom-right',logoOpacity:80,logoMargin:20,overlayText:'',overlayEnabled:false,autoplay:true,loop:true,hideDelay:3000};

function loadConfig(){try{const r=localStorage.getItem(STORAGE_KEY);return r?{...DEFAULTS,...JSON.parse(r)}:{...DEFAULTS}}catch{return{...DEFAULTS}}}
function saveConfig(c){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(c))}catch{}}

function extractId(url){try{const u=new URL(url.trim());if(!u.hostname.includes('youtube.com')&&!u.hostname.includes('youtu.be'))return null;if(u.searchParams.has('v'))return u.searchParams.get('v');const p=u.pathname.replace(/^\//,'').split('/');if(u.hostname.includes('youtu.be')&&p[0])return p[0];if(p[0]==='embed'&&p[1])return p[1];if(p[0]==='shorts'&&p[1])return p[1];return null}catch{return null}}
function fmt(s){if(!s||!isFinite(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+sec.toString().padStart(2,'0')}

let config=loadConfig();
let player=null,playing=false,muted=false,currentVideo=0,videoIds=[],duration=0,progress=0;
let playerReady=false,hideTimer=null,fbConnected=false;
let lastSend='';
const $=id=>document.getElementById(id);

if(location.hash==='#/remote'){renderRemote();document.title='Control Remoto';return}

fbDB.ref('.info/connected').on('value',snap=>{
  fbConnected=snap.val()===true;
  const dot=$('fbDot');
  if(dot)dot.className='dot'+(fbConnected?'':' off');
});

setInterval(()=>{
  const s={playing,muted,currentVideo,videoIds,duration,progress:Math.round(progress)};
  const j=JSON.stringify(s);
  if(j!==lastSend){lastSend=j;fbDB.ref('player/state').set(s)}
},1200);

fbDB.ref('commands').on('child_added',snap=>{
  const cmd=snap.val();
  snap.ref.remove();
  if(!cmd||!cmd.action)return;
  if(cmd.action==='play'){if(player)player.playVideo()}
  else if(cmd.action==='pause'){if(player)player.pauseVideo()}
  else if(cmd.action==='toggle'){if(player)playing?player.pauseVideo():player.playVideo()}
  else if(cmd.action==='next')next();
  else if(cmd.action==='prev')prev();
  else if(cmd.action==='restart')restart();
  else if(cmd.action==='mute')toggleMute();
  else if(cmd.action==='fullscreen')toggleFullscreen();
  else if(cmd.action==='load')loadVideo(cmd.index);
  else if(cmd.action==='addVideo'){if(cmd.url)addVideos([cmd.url])}
  else if(cmd.action==='removeVideo'){if(typeof cmd.index==='number')removeVideo(cmd.index)}
});

let apiReady=false;
window.onYouTubeIframeAPIReady=()=>{apiReady=true;tryInit()};
if(!document.querySelector('#yt-api')){const t=document.createElement('script');t.id='yt-api';t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t)}

function tryInit(){
  if(!apiReady||videoIds.length===0||player)return;
  player=new YT.Player('player',{
    height:'100%',width:'100%',
    playerVars:{controls:0,modestbranding:1,rel:0,iv_load_policy:3,disablekb:1,fs:0,cc_load_policy:0,autoplay:1,playsinline:1,mute:1,origin:location.origin},
    events:{
      onReady:()=>{
        playerReady=true;muted=player.isMuted();
        if(videoIds.length){player.loadVideoById(videoIds[0]);currentVideo=0;if(config.autoplay)setTimeout(()=>player.playVideo(),300)}
      },
      onStateChange:e=>{
        if(e.data===YT.PlayerState.PLAYING){playing=true;updateUI()}
        else if(e.data===YT.PlayerState.PAUSED){playing=false;updateUI()}
        else if(e.data===YT.PlayerState.ENDED){
          playing=false;const n=currentVideo+1;
          if(n<videoIds.length){player.loadVideoById(videoIds[n]);currentVideo=n}
          else if(config.loop&&videoIds.length){player.loadVideoById(videoIds[0]);currentVideo=0}
          updateUI()
        }else if(e.data===YT.PlayerState.CUED){if(player.getDuration)duration=player.getDuration();updateUI()}
      },
      onError:()=>{}
    }
  });
  setInterval(()=>{if(player&&player.getCurrentTime){progress=player.getCurrentTime();if(player.getDuration)duration=player.getDuration();updateUI()}},500);
}

function toggleFullscreen(){
  if(document.fullscreenElement||document.webkitFullscreenElement){
    if(document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
  }else{
    const el=document.getElementById('player-wrap');
    if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});
    else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
  }
}

function onFullscreenChange(){
  const isFs=!!(document.fullscreenElement||document.webkitFullscreenElement);
  document.getElementById('app').classList.toggle('fullscreen',isFs);
  $('btnFullscreen').textContent=isFs?'✕':'⛶';
  $('exit-fs').classList.toggle('hidden',!isFs);
  if(isFs){
    $('controls').classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer=setTimeout(()=>{$('controls').classList.add('hidden');$('exit-fs').classList.add('hidden')},config.hideDelay||3000);
  }else{
    $('exit-fs').classList.add('hidden');
  }
}
document.addEventListener('fullscreenchange',onFullscreenChange);
document.addEventListener('webkitfullscreenchange',onFullscreenChange);

function addVideos(urls){
  const ids=[];const validUrls=[];
  urls.forEach(u=>{const id=extractId(u);if(id){ids.push(id);validUrls.push(u)}});
  if(!ids.length)return;
  const wasEmpty=videoIds.length===0;
  videoIds=[...videoIds,...ids];config.videoUrls=[...config.videoUrls,...validUrls];
  saveConfig(config);
  if(!player)tryInit();
  else if(wasEmpty&&playerReady&&videoIds.length){player.loadVideoById(videoIds[0]);currentVideo=0}
  updateUI();
}

function removeVideo(i){
  videoIds.splice(i,1);config.videoUrls.splice(i,1);
  saveConfig(config);
  if(!videoIds.length){currentVideo=0;if(player)player.stopVideo()}
  else if(i<=currentVideo){currentVideo=Math.max(0,currentVideo-1);if(playerReady&&videoIds.length)player.loadVideoById(videoIds[currentVideo]);else if(playerReady)player.stopVideo()}
  updateUI();
}

function loadVideo(i){if(!player||i<0||i>=videoIds.length)return;player.loadVideoById(videoIds[i]);currentVideo=i;updateUI()}
function toggleMute(){if(player){player.isMuted()?player.unMute():player.mute();muted=player.isMuted();updateUI()}}
function next(){if(!player||!videoIds.length)return;const i=(currentVideo+1)%videoIds.length;player.loadVideoById(videoIds[i]);currentVideo=i;updateUI()}
function prev(){if(!player||!videoIds.length)return;const i=(currentVideo-1+videoIds.length)%videoIds.length;player.loadVideoById(videoIds[i]);currentVideo=i;updateUI()}
function restart(){if(player){player.seekTo(0,true);player.playVideo()}}

function applyLogo(){
  const el=$('logo-overlay');
  if(!config.logo){el.style.display='none';return}
  el.src=config.logo;el.style.display='block';
  el.style.width=config.logoSize+'px';el.style.height='auto';
  el.style.opacity=config.logoOpacity/100;
  const m=config.logoMargin+'px';const p=config.logoPosition;
  el.style.top=el.style.bottom=el.style.left=el.style.right=el.style.transform='none';
  if(p==='top-left'){el.style.top=m;el.style.left=m}else if(p==='top-right'){el.style.top=m;el.style.right=m}else if(p==='bottom-left'){el.style.bottom=m;el.style.left=m}else if(p==='bottom-right'){el.style.bottom=m;el.style.right=m}else if(p==='center'){el.style.top='50%';el.style.left='50%';el.style.transform='translate(-50%,-50%)'}
}

function applyOverlay(){const el=$('overlay-text');if(config.overlayEnabled&&config.overlayText){el.textContent=config.overlayText;el.style.display='block'}else el.style.display='none'}

function updateUI(){
  $('videoNum').textContent=(videoIds.length?currentVideo+1:0)+'/'+videoIds.length;
  $('timeDisplay').textContent=fmt(progress)+'/'+fmt(duration);
  $('progressBar').style.width=duration>0?(progress/duration*100)+'%':'0%';
  $('btnPlay').textContent=playing?'⏸':'▶';
  $('btnMute').textContent=muted?'🔇':'🔊';
  $('statusText').textContent=videoIds.length?(currentVideo+1)+'/'+videoIds.length:'Sin videos';
  const sl=$('sideList');
  if(!videoIds.length)sl.innerHTML='<div style="text-align:center;padding:30px 10px;color:rgba(255,255,255,.2);font-size:12px">Agrega videos desde el input de abajo</div>';
  else sl.innerHTML=videoIds.map((id,i)=>'<div class="side-item'+(i===currentVideo?' active':'')+'" onclick="loadVideo('+i+')"><span class="idx">'+(i+1)+'</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+id+'</span>'+(i===currentVideo?'<span style="font-size:9px;color:#4ade80">▶</span>':'')+'<button class="del" onclick="event.stopPropagation();removeVideo('+i+')">✕</button></div>').join('');
  applyLogo();applyOverlay();
}

function resetTimer(){
  $('controls').classList.remove('hidden');
  $('exit-fs').classList.remove('hidden');
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>{$('controls').classList.add('hidden');$('exit-fs').classList.add('hidden')},config.hideDelay||3000);
}
document.addEventListener('mousemove',resetTimer);
document.addEventListener('touchstart',resetTimer);
resetTimer();

$('btnPlay').onclick=()=>{if(player)player.playVideo()}
$('btnPrev').onclick=prev;$('btnNext').onclick=next;$('btnRestart').onclick=restart;$('btnMute').onclick=toggleMute;
$('btnFullscreen').onclick=toggleFullscreen;$('exit-fs').onclick=toggleFullscreen;
$('btnMinimize').onclick=()=>$('controls').classList.add('hidden');
$('sideInput').onkeydown=e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v){addVideos([v]);e.target.value=''}}};

$('savePlaylistBtn').onclick=function(){
  saveConfig(config);
  if(fbConnected)fbDB.ref('player/state').set({playing,muted,currentVideo,videoIds,duration,progress:Math.round(progress)});
  const orig=this.textContent;
  this.textContent='✓ Guardado';
  setTimeout(()=>{this.textContent=orig},2000);
};

$('settings-btn').onclick=()=>{
  const m=document.createElement('div');m.className='modal-overlay';
  m.onclick=e=>{if(e.target===m)m.remove()};
  const dc={...config}; window._dc=dc;
  m.innerHTML=`
    <div class="modal" onclick="event.stopPropagation()">
      <div class="between"><h2>Configuración</h2><button class="btn" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
      <label>Subir logo</label>
      <div class="flex">${dc.logo?'<img src="'+dc.logo+'" style="height:50px;border-radius:4px">':''}<input type="file" accept="image/*" id="logoInput"></div>
      ${dc.logo?'<div class="flex"><button class="btn btn-danger" onclick="_dc.logo=null;document.getElementById(\'logoInput\').value=\'\';document.querySelector(\'.modal img\')?.remove();this.parentElement.remove()">Eliminar logo</button></div>':''}
      <label>Tamaño: <span id="lsv">${dc.logoSize}</span>px</label>
      <input type="range" min="20" max="3000" value="${dc.logoSize}" oninput="_dc.logoSize=+this.value;lsv.textContent=this.value;var p=document.getElementById('logo-preview');if(p)p.style.width=this.value+'px'">
      <label>Opacidad: <span id="lov">${dc.logoOpacity}</span>%</label>
      <input type="range" min="10" max="100" value="${dc.logoOpacity}" oninput="_dc.logoOpacity=+this.value;lov.textContent=this.value;var p=document.getElementById('logo-preview');if(p)p.style.opacity=this.value/100">
      <label>Margen: <span id="lmv">${dc.logoMargin}</span>px</label>
      <input type="range" min="0" max="100" value="${dc.logoMargin}" oninput="_dc.logoMargin=+this.value;lmv.textContent=this.value">
      <label>Posición</label>
      <select onchange="_dc.logoPosition=this.value">
        <option value="top-left"${dc.logoPosition==='top-left'?' selected':''}>Sup. izquierda</option>
        <option value="top-right"${dc.logoPosition==='top-right'?' selected':''}>Sup. derecha</option>
        <option value="bottom-left"${dc.logoPosition==='bottom-left'?' selected':''}>Inf. izquierda</option>
        <option value="bottom-right"${dc.logoPosition==='bottom-right'?' selected':''}>Inf. derecha</option>
        <option value="center"${dc.logoPosition==='center'?' selected':''}>Centro</option>
      </select>
      <label>Texto overlay</label>
      <input type="text" value="${(dc.overlayText||'').replace(/"/g,'&quot;')}" onchange="_dc.overlayText=this.value" placeholder="Texto informativo">
      <div class="flex mt"><input type="checkbox" id="ovChk" ${dc.overlayEnabled?'checked':''} onchange="_dc.overlayEnabled=this.checked"><label for="ovChk" style="margin:0;font-size:13px">Activar overlay</label></div>
      <div class="flex"><input type="checkbox" id="apChk" ${dc.autoplay?'checked':''} onchange="_dc.autoplay=this.checked"><label for="apChk" style="margin:0;font-size:13px">Autoplay</label></div>
      <div class="flex"><input type="checkbox" id="lpChk" ${dc.loop?'checked':''} onchange="_dc.loop=this.checked"><label for="lpChk" style="margin:0;font-size:13px">Loop</label></div>
      <label>Ocultar controles: <span id="hdv">${dc.hideDelay}</span>ms</label>
      <input type="range" min="1000" max="15000" step="500" value="${dc.hideDelay}" oninput="_dc.hideDelay=+this.value;hdv.textContent=this.value">
      ${dc.logo?'<div style="margin:12px 0;border:1px dashed rgba(255,255,255,.1);border-radius:8px;padding:12px;text-align:center"><img id="logo-preview" src="'+dc.logo+'" style="width:'+dc.logoSize+'px;height:auto;opacity:'+(dc.logoOpacity/100)+';border-radius:4px"></div>':''}
      <div class="flex between mt">
        <button class="btn btn-danger" onclick="localStorage.removeItem('${STORAGE_KEY}');location.reload()">Restablecer</button>
        <div class="flex">
          <button class="btn" onclick="this.closest('.modal-overlay').remove()" style="margin-right:4px">Cancelar</button>
          <button class="btn btn-primary" id="saveSettingsBtn">💾 Guardar Cambios</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(m);
  document.getElementById('logoInput').onchange=function(){
    const file=this.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=function(e){
      if(window._dc)window._dc.logo=e.target.result;
      applyLogo();
      const prev=document.getElementById('logo-preview');
      if(prev)prev.src=e.target.result;
    };
    r.readAsDataURL(file);
  };
  document.getElementById('saveSettingsBtn').onclick=function(){
    const dc=window._dc||{};
    Object.assign(config,dc);
    saveConfig(config);
    applyLogo();applyOverlay();resetTimer();
    this.textContent='✓ Guardado';
    setTimeout(()=>{if(this.closest('.modal-overlay'))this.closest('.modal-overlay').remove()},800);
    delete window._dc;
  };
};

$('remote-btn').onclick=()=>{
  const pop=document.createElement('div');
  pop.style.cssText='position:fixed;top:60px;right:16px;z-index:40;background:rgba(0,0,0,.85);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;text-align:center;width:220px';
  const url=location.href.split('#')[0]+'#/remote';
  pop.innerHTML='<div style="font-size:11px;color:rgba(255,255,255,.6);margin-bottom:8px">📱 Escanea para control remoto</div><img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data='+encodeURIComponent(url)+'" style="border-radius:8px;background:#fff;padding:8px;width:160px;height:160px" crossorigin="anonymous"><div style="font-size:9px;color:rgba(255,255,255,.3);word-break:break-all;margin-top:6px;padding:0 4px">'+url+'</div>';
  document.body.appendChild(pop);
  pop.onclick=()=>pop.remove();
};

if(config.videoUrls&&config.videoUrls.length){
  const ids=[];config.videoUrls.forEach(u=>{const id=extractId(u);if(id)ids.push(id)});
  if(ids.length){videoIds=ids;tryInit()}
}
updateUI();

function renderRemote(){
  document.body.innerHTML=`
    <div class="remote-page">
      <div style="color:rgba(255,255,255,.4);font-size:12px;letter-spacing:2px">CONTROL REMOTO</div>
      <div style="text-align:center">
        <div style="font-size:36px;font-weight:700" id="rnum">--/--</div>
        <div style="font-size:12px;color:rgba(255,255,255,.5)" id="rtime">--:-- / --:--</div>
        <div class="rstatus" id="rstatus"><span class="dot" id="rfbDot"></span><span id="rfbText">Conectando...</span></div>
      </div>
      <div class="rgrid">
        <button class="rbtn" onclick="sendCmd('prev')">⏮</button>
        <button class="rbtn rbtn-big" onclick="sendCmd('toggle')" id="rplay">▶</button>
        <button class="rbtn" onclick="sendCmd('next')">⏭</button>
        <button class="rbtn" onclick="sendCmd('restart')">↺</button>
        <button class="rbtn" onclick="sendCmd('mute')" id="rmute">🔊</button>
        <button class="rbtn" onclick="sendCmd('fullscreen')">⛶</button>
      </div>
      <div style="width:100%;max-width:320px;margin-top:4px;display:flex;gap:6px">
        <input class="rinput" id="rAddInput" placeholder="Pega enlace YouTube + Enter" style="flex:1">
        <button class="rbtn" style="width:44px;height:44px;font-size:18px;border-radius:10px;flex-shrink:0" onclick="addRemoteVideo()">+</button>
      </div>
      <div class="rlist" id="rlist"><div style="text-align:center;padding:20px;color:rgba(255,255,255,.2);font-size:12px">Esperando datos del reproductor...</div></div>
    </div>`;
  window.sendCmd=function(action,extra){fbDB.ref('commands').push({action,...extra,timestamp:Date.now(),id:Math.random().toString(36).slice(2)})};
  window.addRemoteVideo=function(){const inp=document.getElementById('rAddInput');if(!inp||!inp.value.trim())return;sendCmd('addVideo',{url:inp.value.trim()});inp.value=''};
  document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='rAddInput'){e.preventDefault();window.addRemoteVideo()}});
  fbDB.ref('.info/connected').on('value',snap=>{const c=snap.val()===true;const d=document.getElementById('rfbDot');const t=document.getElementById('rfbText');if(d)d.className='dot'+(c?' on':'');if(t)t.textContent=c?'Conectado':'Desconectado'});
  fbDB.ref('player/state').on('value',snap=>{
    const s=snap.val();if(!s)return;
    const rn=document.getElementById('rnum');if(rn)rn.textContent=s.videoIds&&s.videoIds.length?(s.currentVideo+1)+'/'+s.videoIds.length:'--/--';
    const rt=document.getElementById('rtime');if(rt)rt.textContent=fmt(s.progress)+'/'+fmt(s.duration);
    const rp=document.getElementById('rplay');if(rp)rp.textContent=s.playing?'⏸':'▶';
    const rm=document.getElementById('rmute');if(rm)rm.textContent=s.muted?'🔇':'🔊';
    const rl=document.getElementById('rlist');
    if(rl){
      if(!s.videoIds||!s.videoIds.length)rl.innerHTML='<div style="text-align:center;padding:20px;color:rgba(255,255,255,.2);font-size:12px">Sin videos en el reproductor</div>';
      else rl.innerHTML=s.videoIds.map((id,i)=>'<div class="ritem'+(i===s.currentVideo?' active':'')+'" onclick="sendCmd(\'load\',{index:'+i+'})"><span class="idx">'+(i+1)+'</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+id+'</span>'+(i===s.currentVideo?'<span style="font-size:9px;color:#4ade80">▶</span>':'')+'<button class="rdel" onclick="event.stopPropagation();sendCmd(\'removeVideo\',{index:'+i+'})">✕</button></div>').join('');
    }
  });
  setTimeout(()=>sendCmd('ping'),500);
}
</script>
</body>
</html>
